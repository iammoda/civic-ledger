# Fly.io config for the Civic Ledger backend (API + arq worker).
#
#   fly launch --no-deploy        # once: create the app, attach Postgres/Redis
#   fly secrets set DATABASE_URL=... REDIS_URL=... ANTHROPIC_API_KEY=... \
#       OPENAI_API_KEY=... ADMIN_API_TOKEN=... SENTRY_DSN=... \
#       BACKEND_CORS_ORIGINS=https://your-frontend.example APP_ENV=production
#   fly deploy
#
# Postgres needs the pgvector extension (Fly Postgres supports it, or use Neon).
app = "civic-ledger-api"
primary_region = "yyz"

[build]
  dockerfile = "backend/Dockerfile"

[deploy]
  # Migrations run once per release, before new machines take traffic.
  release_command = "python -m alembic upgrade head"

[processes]
  api = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m arq app.workers.main.WorkerSettings"

[http_service]
  processes = ["api"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  processes = ["api"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[vm]]
  processes = ["worker"]
  memory = "1gb"   # weekly influence sync holds large in-memory key sets
  cpu_kind = "shared"
  cpus = 1
