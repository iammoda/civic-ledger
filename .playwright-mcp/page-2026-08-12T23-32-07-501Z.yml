        - link "Open Data Licence Agreement — Office of the Commissioner of Lobbying" [ref=f10e54] [cursor=pointer]:
          - /url: /en/open-data/open-data-licence-agreement/
      - heading "Lobbying registrations" [level=2] [ref=f10e55]
      - paragraph [ref=f10e56]: A lobbying registration is required when a paid individual communicates with federal public office holders about certain subject matter, either on behalf of their employer or a client.
      - paragraph [ref=f10e57]: "This dataset contains all lobbying registrations filed with the:"
      - list [ref=f10e58]:
        - listitem [ref=f10e59]:
          - text: Office of the Registrar of Lobbyists between the dates January 31, 1996 and June 30, 2008 (
          - emphasis [ref=f10e60]: Lobbyists Registration Act
          - text: ); and
        - listitem [ref=f10e61]:
          - text: Office of the Commissioner of Lobbying from July 2, 2008 onward (
          - emphasis [ref=f10e62]: Lobbying Act
          - text: ).
      - paragraph [ref=f10e63]: The dataset provides a primary and secondary files in CSV format, allowing for one-to-many relationships for some data elements found in a registration. Any content entered manually in a registration is in the language of choice of the user. A data dictionary file containing definitions for all data elements in the dataset is also available.
      - heading "Dataset resources" [level=3] [ref=f10e64]
