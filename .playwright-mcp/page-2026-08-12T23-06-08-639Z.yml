      - heading "Monthly communication reports" [level=2] [ref=e88]
      - paragraph [ref=e89]: Communication reports disclose required details about "oral and arranged" communications between lobbyists and Designated Public Office Holders (DPOH).
      - paragraph [ref=e90]:
        - text: This dataset contains all communication reports filed with the Office of the Commissioner of Lobbying by registrants under the
        - emphasis [ref=e91]: Lobbying Act
        - text: ", which came into force on July 2, 2008."
      - paragraph [ref=e92]: The dataset provides a primary file and secondary files in CSV format allowing for one-to-many relationships for some data elements collected in a communication report. Any content entered manually in a report is in the language of choice of the user. A data dictionary file containing definitions for all data elements in the dataset is also available.
