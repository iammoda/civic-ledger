name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install ruff
      - name: Ruff (correctness rules)
        run: ruff check backend/app backend/tests scripts
      - name: Tests (SQLite suite)
        run: pytest backend/tests -q
        env:
          PYTHONPATH: backend
          # Isolate from any ambient services; mirrors tests/conftest.py.
          REDIS_URL: redis://127.0.0.1:1/0
          RATE_LIMIT_ENABLED: "false"

  frontend:
    name: Frontend (build + lint + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace frontend
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Build
        run: npm run build --workspace frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/v1
          NEXT_PUBLIC_SITE_URL: https://example.com
